model:
  model_id: "dit"
  width: 24
  height: 24
  T: 1000
  in_channels: 3
  n_window: 20
  patch_size: 3
  n_heads: 20
  d_model: 320
  n_blocks: 8
  C: 5000
  bidirectional: false
  nocompile: false
  checkpoint: null
  rope_type: "rope"
  use_flex: true

action_model:
  model_id: "action_dit"
  n_actions: 10
  d_actions: 320  # should match d_model
  beta: 0.01
  action_dropout: 0.05
  n_window: 21
  checkpoint: null

train:
  lr1: 0.02
  lr2: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-5
  max_steps: 2500 
  warmup_steps: 100 
  batch_size: 64
  noclip: false
  duration: 1
  fps: 21
  debug: false
  dtype: "bf16"
  action_dropout: 0.2

wandb:
  name: null
  project: "toy-genie"
  run_name: "genie-inspired"

