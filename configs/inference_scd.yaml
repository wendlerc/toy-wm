model:
  model_id: "scd"
  width: 24
  height: 24
  T: 1000
  in_channels: 3
  n_window: 30
  patch_size: 3
  n_heads: 24
  d_model: 384
  n_blocks_encoder: 8
  n_blocks_decoder: 4
  C: 5000
  bidirectional: false
  nocompile: false
  checkpoint: "experiments/ethereal-wildflower-889/model.pt"
  rope_type: "rope"
  use_flex: true

train:
  lr1: 0.02
  lr2: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-5
  max_steps: 5000
  batch_size: 64
  noclip: false
  duration: 1
  fps: 31
  debug: false
  dtype: "bf16"
  action_dropout: 0.2

wandb:
  name: null
  project: "toy-wm"
  run_name: "ethereal-wildflower-889"
