model:
  model_id: "dit"
  width: 20
  height: 16
  T: 1000
  in_channels: 32
  n_window: 30
  patch_size: 2
  n_heads: 24
  d_model: 384
  n_blocks: 12
  C: 5000
  bidirectional: false
  nocompile: false
  checkpoint: null
  rope_type: "rope"
  use_flex: true

dataset:
  dataset_id: "doom1p"
  num_workers: 8
  batch_size: 64
  duration: 1
  fps: 30
  shuffle: true
  debug: false
  shard_dir: "./datasets/doom_latents"

train:
  trainer_id: "diffusion_forcing"
  lr1: 0.02
  lr2: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-5
  max_steps: 5000
  warmup_steps: 200
  noclip: false
  duration: 1
  fps: 30
  debug: false
  dtype: "bf16"
  action_dropout: 0.2

wandb:
  name: null
  project: "toy-wm"
  run_name: "doom-diffusion-forcing"
